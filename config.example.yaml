# ============================================================
# TWnetvalue 設定檔
# 淨值 = 各帳戶證券市值合計 + 期貨帳戶權益數 + 現金 − 負債
# ============================================================

# FinMind token(抓收盤價與大盤基準用)
# 到 https://finmindtrade.com/ 免費註冊拿 token,存成 finmind_token.json:
#     { "api_token": "你的 token" }
finmind_token_file: finmind_token.json

# ---------- 帳戶 ----------
# 每個帳戶一個 adapter。API 憑證放 .env,不要寫在這裡。
# 先用 manual 跑起來,之後申請到券商 API 再把對應帳戶 enabled 改 true。
accounts:

  # 永豐 Shioaji API
  # .env 需要:SHIOAJI_API_KEY / SHIOAJI_SECRET_KEY
  # 申請時務必勾「帳務」+「正式環境」權限,否則查庫存會 401。
  # 新 key 第一次用正式環境前,永豐規定要先跑 shioaji_test_flow.py 完成模擬測試。
  sinopac:
    type: shioaji
    enabled: false

  # 富邦 Neo API
  # .env 需要:FUBON_ID / FUBON_PASSWORD / FUBON_CERT_PATH / FUBON_CERT_PASSWORD
  fubon:
    type: fubon
    enabled: false

  # 富邦期貨帳戶(保證金帳戶,權益數已含未實現損益)
  # 沿用同一組 FUBON_* 憑證。
  #
  # 期貨部位以「實質價值」計入投資部位(而非保證金):
  #   實質價值 = 期貨即時報價 × multiplier × 淨口數
  #   口數與報價都從 query_single_position() 的未平倉明細直接抓,
  #   所以用的是期貨自己的價格,沒有拿現股價替代的基差問題。
  #   帳戶權益數扣掉實質價值後的餘額歸類為現金;槓桿部位這個餘額
  #   會是負的,那是正確的(代表曝險大於自有資金)。
  #
  # 契約乘數要「逐商品」設定,不同期貨規格差很多:
  #   小型台灣50 ETF 期貨(FISRF)= 每口 1000 單位
  #   小型個股期貨(如小台達電 FIRVF)= 每口 100 股
  # 全部套同一個乘數會把個股期貨的部位價值放大 10 倍。
  # key 用 query_single_position() 回傳的 symbol(不含月份);沒列到的商品
  # 會用 default_multiplier 並在執行時印警告,提醒你補設定。
  fubon_futures:
    type: fubon_futures
    enabled: false
    multipliers:
      FISRF: 1000
      FIRVF: 100
    default_multiplier: 100

  # 手動持股表(沒有券商 API 時用這個)
  # 只需要維護代號和股數,收盤價每天自動抓。cost 欄位選填(均價成本)。
  manual:
    type: manual
    enabled: true
    positions_file: positions_manual.csv

  # 海外持股(複委託):富邦 Neo API 查不到複委託庫存,只能手動維護股數。
  # ticker 用 Yahoo Finance 代號(日股加 .T,美股直接寫),
  # 價格與匯率由 yfinance 自動抓並換算台幣。
  fubon_foreign:
    type: manual_foreign
    enabled: false
    positions_file: positions_foreign.csv

# ---------- 現金 ----------
# 注意:券商交割戶餘額由 API 自動抓(永豐 account_balance、富邦 bank_remain),
# 不要寫在這裡,否則會重複計算!
# 這一區只填券商抓不到的錢(個人銀行帳戶、其他券商等),單位:元。
# 改完跑 python update_cash.py 就好,不用重跑完整快照。
cash:
  - name: 其他銀行帳戶
    amount: 0

# ---------- 負債 ----------
# 槓桿、質押、貸款等,單位:元。填當下的「未償還本金」,只能是純數字。
#
# ⚠️ 借錢買股票時注意時序,不然同一筆錢會被算兩次:
#   買進當天 → 應付款已經記在「未交割款」了,負債先不要加
#   借款撥入交割戶時 → 現金增加了,這時 debt 才要加上借款
debt:
  - name: 質押借款
    amount: 0

# ---------- 基準 ----------
# 淨值曲線要疊的比較基準(FinMind 的 data_id)
# 櫃買指數是 TPEx(TWO / OTC 都查不到資料)
benchmarks:
  - id: TAIEX
    name: 加權指數
  - id: TPEx
    name: 櫃買指數
  - id: "0050"
    name: 元大台灣50

# ---------- 大盤指標卡 ----------
# 儀表板最上方要顯示「點數 / 漲跌點 / 漲跌%」的指數,要先列在 benchmarks 裡。
# 新增基準後,歷史收盤不會自動回填,只會從下次快照開始累積。
market_cards:
  - TAIEX
  - TPEx
